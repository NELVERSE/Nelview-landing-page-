<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style id="nv-guard">
      html {
        background: #fff;
      }
      body {
        opacity: 0;
        animation: nvShow 0.01s 0.25s forwards;
      }
      @keyframes nvShow {
        to {
          opacity: 1;
        }
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Nelview</title>
    <meta
      name="description"
      content="Nelview is in private beta. Join the waitlist and we'll email you when your spot opens."
    />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="preload"
      href="assets/fonts/geist-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="../styles/site.css" />
    <link rel="stylesheet" href="../styles/pages.css" />
    <link rel="stylesheet" href="../styles/color.css" />
    <link rel="stylesheet" href="../styles/theme.css" />
  </head>
  <body data-page="signin">
    <div data-site-header></div>
    <main class="si-wrap" data-screen-label="Sign in">
      <div class="wrap">
        <div class="si-box">
          <h1>Sign in to Nelview</h1>
          <p class="lead">
            Nelview is in private beta. Join the waitlist and we'll email you
            when your spot opens.
          </p>
          <div class="roles">
            <a class="role" href="waitlist.html"
              ><span class="ico lg"
                ><span data-ic="file" data-s="20"></span></span
              ><span
                ><b>Researcher or student</b
                ><small>Reviews, Document Editor, Journal Check</small></span
              ><span data-ic="arrow"></span
            ></a>
          </div>
          <div class="si-alt">
            <span
              >New to Nelview?
              <a href="waitlist.html">Join the waitlist</a></span
            >
          </div>
        </div>
      </div>
    </main>
    <div data-site-footer></div>
    <script type="module" src="../scripts/site.ts"></script>
    <script type="module" src="../scripts/i18n.ts"></script>
    <script type="module" src="../scripts/motion.ts"></script>
  </body>
</html>
