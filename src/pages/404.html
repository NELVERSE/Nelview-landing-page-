<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // This page is served for every missing URL, including nested ones such
      // as /guides/old-post, where relative paths would point at /guides/assets.
      // Anchor them to the site root. Project sites on github.io live under
      // /<repository>/; everywhere else the site is at the domain root.
      (function () {
        var seg = location.pathname.split("/")[1];
        var root =
          /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
        document.write('<base href="' + root + '">');
      })();
    </script>
    <style id="nv-guard">
      html {
        background: #fff;
      }
      body {
        opacity: 0;
        animation: nvShow 0.01s 0.25s forwards;
      }
      @keyframes nvShow {
        to {
          opacity: 1;
        }
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Nelview</title>
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="preload"
      href="assets/fonts/geist-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="../styles/site.css" />
    <link rel="stylesheet" href="../styles/pages.css" />
    <link rel="stylesheet" href="../styles/color.css" />
    <link rel="stylesheet" href="../styles/theme.css" />
  </head>
  <body data-page="404">
    <div data-site-header></div>
    <main class="nf" data-screen-label="404">
      <div class="wrap">
        <span class="code">404</span>
        <h1>This page didn't pass review.</h1>
        <p class="lead">
          The link may be old or mistyped. Try one of these instead.
        </p>
        <div class="row">
          <a class="btn btn-d" href="index.html">Back to home</a
          ><a class="btn btn-g" href="resources.html">Browse guides</a>
        </div>
        <div class="nf-links">
          <a href="pricing.html">Pricing</a
          ><a href="institutions.html">For universities</a
          ><a href="experts.html">For reviewers</a
          ><a href="contact.html">Contact</a>
        </div>
      </div>
    </main>
    <div data-site-footer></div>
    <script type="module" src="../scripts/site.ts"></script>
    <script type="module" src="../scripts/i18n.ts"></script>
    <script type="module" src="../scripts/motion.ts"></script>
  </body>
</html>
