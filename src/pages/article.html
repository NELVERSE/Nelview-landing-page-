<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style id="nv-guard">
      html {
        background: #fff;
      }
      body {
        opacity: 0;
        animation: nvShow 0.01s 0.25s forwards;
      }
      @keyframes nvShow {
        to {
          opacity: 1;
        }
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Article · Nelview</title>
    <meta
      name="description"
      content="Guides from Nelview on peer review, choosing journals, grants and getting research published."
    />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="preload"
      href="assets/fonts/geist-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="../styles/site.css" />
    <link rel="stylesheet" href="../styles/pages.css" />
    <link rel="stylesheet" href="../styles/color.css" />
    <link rel="stylesheet" href="../styles/theme.css" />
  </head>
  <body data-page="res">
    <div data-site-header></div>
    <main>
      <div class="wrap">
        <header class="art-hd" data-screen-label="Article header">
          <h1 id="a-h"></h1>
          <p class="dek" id="a-x"></p>
          <div class="art-by">
            <div class="who" id="a-who"></div>
            <div class="share">
              <button type="button" id="copy" aria-label="Copy link">
                <span data-ic="link" data-s="16"></span></button
              ><a
                id="sh-li"
                target="_blank"
                rel="noopener"
                aria-label="Share on LinkedIn"
                ><span data-ic="linkedin" data-s="16"></span></a
              ><a id="sh-mail" aria-label="Share by email"
                ><span data-ic="mail" data-s="16"></span
              ></a>
            </div>
          </div>
        </header>
        <div id="a-cv"></div>
        <div class="art" data-screen-label="Article body">
          <aside class="toc" id="toc"></aside>
          <article>
            <div class="prose" id="a-b"></div>
            <div class="acard" id="a-card"></div>
            <div class="art-cta">
              <div>
                <b>Check your paper against these standards.</b
                ><span>Get a 0–100 readiness score in minutes.</span>
              </div>
              <a class="btn btn-p" href="waitlist"
                >Review my paper<span data-ic="arrow"></span
              ></a>
            </div>
          </article>
        </div>
      </div>
      <section class="sec alt" data-screen-label="Related">
        <div class="wrap">
          <div class="split-head" style="margin-bottom: 40px">
            <h2 class="h2">
              Keep reading
            </h2>
            <p class="lead" style="justify-self: end">
              <a href="resources">All guides</a>
            </p>
          </div>
          <div class="pgrid" id="rel"></div>
        </div>
      </section>
    </main>
    <div class="toast" id="toast">Link copied</div>
    <div data-site-footer></div>
    <script type="module" src="../scripts/posts.ts"></script>
    <script type="module" src="../scripts/site.ts"></script>
    <script type="module" src="../scripts/i18n.ts"></script>
    <script type="module" src="../scripts/pages/article.ts"></script>
    <script type="module" src="../scripts/motion.ts"></script>
  </body>
</html>
