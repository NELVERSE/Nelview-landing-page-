name: Build and deploy

# main    -> production: build, then deploy to GitHub Pages.
# preview -> preview: build only (marked noindex). The built site is attached
#            to the run as the "site-preview" artifact.
# Pull requests into main get the same preview build as a check.
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NELVIEW_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Browser tests against the built site
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e
      - name: Upload production site for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Upload preview site
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: site-preview
          path: dist
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
