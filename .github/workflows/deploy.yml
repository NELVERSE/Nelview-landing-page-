name: Build and test

# Checks only: typecheck, unit tests, build and browser tests on every push to
# main or preview and on pull requests into main. The built site is attached to
# the run as an artifact. Hosting (Vercel) deploys from the branches itself:
# main is production, preview gets its own preview URL.
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NELVIEW_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Browser tests against the built site
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e
      - name: Upload built site
        uses: actions/upload-artifact@v5
        with:
          name: site-${{ env.NELVIEW_ENV }}
          path: dist
          retention-days: 14
