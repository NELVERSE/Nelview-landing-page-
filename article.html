<!doctype html>
<html lang="en" data-animations="off">
  <head>
    <meta charset="utf-8" />
    <style id="nv-guard">
      html {
        background: #fff;
      }
      body {
        opacity: 0;
        animation: nvShow 0.01s 0.25s forwards;
      }
      @keyframes nvShow {
        to {
          opacity: 1;
        }
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Article · Nelview</title>
    <meta
      name="description"
      content="Guides from Nelview on peer review, choosing journals, grants and getting research published."
    />
    <link rel="icon" type="image/png" href="assets/favicon-32.png" />
    <link
      rel="preload"
      href="assets/fonts/geist-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="src/styles/site.css" />
    <link rel="stylesheet" href="src/styles/pages.css" />
    <link rel="stylesheet" href="src/styles/color.css" />
  </head>
  <body data-page="res">
    <div data-site-header></div>
    <main>
      <div class="wrap">
        <header class="art-hd" data-screen-label="Article header">
          <h1 id="a-h"></h1>
          <p class="dek" id="a-x"></p>
          <div class="art-by">
            <div class="who" id="a-who"></div>
            <div class="share">
              <button type="button" id="copy" aria-label="Copy link">
                <span data-ic="link" data-s="16"></span></button
              ><a
                id="sh-li"
                target="_blank"
                rel="noopener"
                aria-label="Share on LinkedIn"
                ><span data-ic="linkedin" data-s="16"></span></a
              ><a id="sh-mail" aria-label="Share by email"
                ><span data-ic="mail" data-s="16"></span
              ></a>
            </div>
          </div>
        </header>
        <div id="a-cv"></div>
        <div class="art" data-screen-label="Article body">
          <aside class="toc" id="toc"></aside>
          <article>
            <div class="prose" id="a-b"></div>
            <div class="acard" id="a-card"></div>
            <div class="art-cta">
              <div>
                <b>Check your paper against these standards.</b
                ><span>Get a 0–100 readiness score in minutes.</span>
              </div>
              <a class="btn btn-p" href="waitlist.html"
                >Review my paper<span data-ic="arrow"></span
              ></a>
            </div>
          </article>
        </div>
      </div>
      <section class="sec alt" data-screen-label="Related">
        <div class="wrap">
          <div class="split-head" style="margin-bottom: 40px">
            <h2 class="h2" style="font-size: clamp(28px, 3.2vw, 40px)">
              Keep reading
            </h2>
            <p class="lead" style="justify-self: end">
              <a href="resources.html">All guides</a>
            </p>
          </div>
          <div class="pgrid" id="rel"></div>
        </div>
      </section>
    </main>
    <div class="toast" id="toast">Link copied</div>
    <div data-site-footer></div>
    <script src="js/posts.js"></script>
    <script>
      (function () {
        var P = NV_POSTS,
          A = NV_AUTH,
          C = NV_CATS;
        var s = new URLSearchParams(location.search).get("p");
        var p =
          P.filter(function (x) {
            return x.s === s;
          })[0] || P[0];
        var a = A[p.a];
        function av(k, c) {
          var o = A[k];
          return o.img
            ? "<span class='av-x " +
                (c || "") +
                "'><img src='" +
                o.img +
                "' alt='' loading='lazy' decoding='async'></span>"
            : "<span class='av-x " +
                (c || "") +
                "' style='background:" +
                o.c +
                "'>" +
                o.i +
                "</span>";
        }
        document.title = p.h + " · Nelview";
        // Every article is served by this one file, so describe the one on show
        // to search engines and link previews.
        (function () {
          function set(sel, val) {
            var e = document.querySelector(sel);
            if (e) e.setAttribute("content", val);
          }
          set('meta[name="description"]', p.x);
          set('meta[property="og:title"]', document.title);
          set('meta[property="og:description"]', p.x);
          var c = document.createElement("link");
          c.rel = "canonical";
          c.href =
            location.origin +
            location.pathname.replace(/\.html$/, "") +
            "?p=" +
            encodeURIComponent(p.s);
          document.head.appendChild(c);
        })();
        document.getElementById("a-h").textContent = p.h;
        document.getElementById("a-x").textContent = p.x;
        document.getElementById("a-who").innerHTML =
          av(p.a) +
          "<div><b>" +
          a.n +
          "</b>" +
          p.d +
          " · " +
          p.m +
          " min read</div>";
        document.getElementById("a-cv").innerHTML =
          "<div class='cover art-cv " +
          p.cv +
          "'><span class='k'>" +
          p.k +
          " · " +
          p.m +
          " MIN READ</span><span class='t'>" +
          p.t +
          "</span></div>";
        var b = document.getElementById("a-b");
        b.innerHTML = p.b;
        var hs = b.querySelectorAll("h2");
        document.getElementById("toc").innerHTML = hs.length
          ? "<h6>ON THIS PAGE</h6>" +
            Array.prototype.map
              .call(hs, function (h) {
                return "<a href='#" + h.id + "'>" + h.textContent + "</a>";
              })
              .join("")
          : "";
        document.getElementById("a-card").innerHTML =
          av(p.a) +
          "<div><span>Written by</span><b>" +
          a.n +
          "</b><span>" +
          a.r +
          "</span></div>";
        var rel = P.filter(function (x) {
          return x !== p && x.c === p.c;
        })
          .concat(
            P.filter(function (x) {
              return x !== p && x.c !== p.c;
            }),
          )
          .slice(0, 3);
        document.getElementById("rel").innerHTML = rel
          .map(function (r) {
            return (
              "<a class='post' href='article.html?p=" +
              r.s +
              "'><div class='cover " +
              r.cv +
              "'><span class='k'>" +
              r.k +
              "</span><span class='t'>" +
              r.t +
              "</span></div><div class='meta'><span>" +
              C[r.c] +
              "</span><span>·</span><span>" +
              r.m +
              " min</span></div><h3>" +
              r.h +
              "</h3><p>" +
              r.x +
              "</p></a>"
            );
          })
          .join("");
        var u = encodeURIComponent(location.href);
        document.getElementById("sh-li").href =
          "https://www.linkedin.com/sharing/share-offsite/?url=" + u;
        document.getElementById("sh-mail").href =
          "mailto:?subject=" + encodeURIComponent(p.h) + "&body=" + u;
        document.getElementById("copy").onclick = function () {
          var t = document.getElementById("toast");
          (navigator.clipboard
            ? navigator.clipboard.writeText(location.href)
            : Promise.resolve()
          )
            .catch(function () {})
            .then(function () {
              t.classList.add("show");
              setTimeout(function () {
                t.classList.remove("show");
              }, 1600);
            });
        };
        var links = document.querySelectorAll("#toc a");
        if (links.length && "IntersectionObserver" in window) {
          var io = new IntersectionObserver(
            function (es) {
              es.forEach(function (e) {
                if (e.isIntersecting)
                  links.forEach(function (l) {
                    l.classList.toggle(
                      "on",
                      l.getAttribute("href") === "#" + e.target.id,
                    );
                  });
              });
            },
            { rootMargin: "-20% 0px -70% 0px" },
          );
          hs.forEach(function (h) {
            io.observe(h);
          });
        }
      })();
    </script>
    <script src="js/site.js"></script>
    <script src="js/i18n.js"></script>
    <!-- Temporarily disabled site animations:
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"
    ></script>
    <script defer src="js/motion.js"></script>
    -->
    <template id="__bundler_thumbnail"
      ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <rect width="100" height="100" fill="#1BB35C"></rect>
        <text
          x="50"
          y="66"
          text-anchor="middle"
          font-family="sans-serif"
          font-size="46"
          font-weight="700"
          fill="#fff"
        >
          N
        </text>
      </svg></template
    >
  </body>
</html>
